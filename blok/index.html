<!doctype html>
<html lang="ms" data-game="blok">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1fa2">
  <script src="../shared/theme-boot.js"></script>
  <title>Susun Blok</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/puzzle-page.css">
  <!-- modulepreload:start (tools/preload.mjs) -->
  <link rel="modulepreload" href="../shared/puzzle-engines.js">
  <link rel="modulepreload" href="../shared/appswarga.js">
  <link rel="modulepreload" href="../shared/arked-link.js">
  <link rel="modulepreload" href="../shared/profile.js">
  <link rel="modulepreload" href="../shared/shared-store.js">
  <link rel="modulepreload" href="../shared/profile-options.js">
  <link rel="modulepreload" href="../shared/select.js">
  <link rel="modulepreload" href="../shared/uuid.js">
  <link rel="modulepreload" href="../shared/rng.js">
  <link rel="modulepreload" href="../shared/leaderboard.js">
  <link rel="modulepreload" href="../shared/config.js">
  <link rel="modulepreload" href="../shared/board.js">
  <link rel="modulepreload" href="../shared/reload.js">
  <link rel="modulepreload" href="../shared/memory-icons.js">
  <link rel="modulepreload" href="../shared/puzzle-sound.js">
  <!-- modulepreload:end -->
  <script type="module" src="../shared/puzzle-page.js"></script>
</head>
<body data-screen="home">
<div id="app">
  <section id="screen-home" class="screen screen-home">
    <header class="home-head">
      <!-- Only when opened from Arked Warga (html.from-arked): back to the game hub. -->
      <button type="button" class="icon-btn" id="btn-hub" aria-label="Kembali ke Arked Warga"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="profile-chip" id="profile-chip"><span class="avatar" id="chip-avatar" aria-hidden="true">?</span><span class="chip-text"><strong id="chip-name">Tetapkan profil</strong><small id="chip-meta">Nama, kategori &amp; kampus</small></span></button>
      <div class="head-actions">
        <button type="button" class="icon-btn" id="btn-help" aria-label="Cara bermain">?</button>
        <!-- Only inside AppsWarga, unless opened from Arked Warga: leaves the webapp. -->
        <button type="button" class="icon-btn" id="btn-close-app" aria-label="Tutup permainan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <div class="puzzle-brand">
      <img src="icon.svg" alt="" width="84" height="84">
      <h1>Susun Blok</h1>
      <p>Susun kepingan dan lengkapkan baris atau lajur.</p>
    </div>
    <dl class="puzzle-home-stats"><div><dt>Markah terbaik</dt><dd id="st-best">0</dd></div><div><dt>Dimainkan</dt><dd id="st-played">0</dd></div></dl>
    <div class="puzzle-settings" role="group" aria-label="Tetapan">
      <button type="button" class="switch-row" id="set-sound" role="switch" aria-checked="true">
        <span class="switch-text">
          <strong>Bunyi</strong>
          <small id="set-sound-hint">Kesan bunyi</small>
        </span>
        <span class="switch" aria-hidden="true"></span>
      </button>
    </div>
    <button type="button" class="btn btn-primary btn-wide" id="btn-play">Main</button>
    <button type="button" class="btn btn-ghost btn-wide" id="btn-board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Papan Markah</button>
    <button type="button" class="app-version" id="btn-version" aria-label="Versi 1.5. Ketik untuk muat semula permainan.">Versi 1.5</button>
  </section>
  <section id="screen-game" class="screen screen-game" hidden>
    <header class="bar"><button type="button" class="icon-btn" id="btn-quit" aria-label="Kembali ke laman utama"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="bar-mid"><span class="bar-title" id="game-score" aria-live="polite">0 mata</span><span class="bar-sub" id="game-mode"></span></div><span class="timer" id="timer" aria-label="Masa">0:00</span></header>
    <div class="puzzle-stage"><p class="puzzle-status" id="game-status" role="status"></p><div class="puzzle-grid" id="game-grid" role="group"></div><div id="game-controls"></div></div>
  </section>
  <section id="screen-result" class="screen screen-result" hidden>
    <header class="bar"><button type="button" class="icon-btn" id="res-home" aria-label="Kembali ke laman utama"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
    <div class="puzzle-result"><img class="res-icon" src="icon.svg" alt="" width="72" height="72"><h2 id="res-title"></h2><p id="res-detail"></p><div class="score" id="res-score"></div><p id="res-time"></p><div class="res-submit" id="res-submit" role="status"></div><div class="puzzle-actions"><button type="button" class="btn btn-primary" id="res-again">Main Lagi</button><button type="button" class="btn btn-ghost" id="res-board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Papan Markah</button></div></div>
  </section>
  <section id="screen-board" class="screen screen-board" hidden>
    <header class="bar"><button type="button" class="icon-btn" id="btn-board-back" aria-label="Kembali"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="bar-mid"><span class="bar-title">Papan Markah</span><span class="bar-sub" id="board-sub"></span></div><button type="button" class="icon-btn" id="btn-board-refresh" aria-label="Muat semula"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
    <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="daily" aria-selected="true">Hari Ini</button><button type="button" role="tab" data-tab="alltime" aria-selected="false">Keseluruhan</button><button type="button" role="tab" data-tab="campus" aria-selected="false">Kampus</button></div><div class="lb-body" id="lb-body" role="tabpanel"></div>
  </section>
</div>
<dialog id="dlg-profile" class="dialog"><form id="profile-form" method="dialog" novalidate><h2>Profil Pemain</h2><p class="muted">Digunakan dalam semua permainan dan papan markah.</p><label class="field"><span>Nama panggilan</span><input id="pf-name" name="nickname" maxlength="20" required autocomplete="nickname" placeholder="cth. Siti_FSKM"></label><label class="field"><span>Kategori</span><span class="select-wrap"><select id="pf-type" name="user_type" required aria-describedby="pf-type-hint"></select></span><small class="field-hint" id="pf-type-hint" hidden></small></label><label class="field"><span>Kampus</span><span class="select-wrap"><select id="pf-campus" name="campus" required></select></span></label><p class="form-error" id="pf-error" role="alert"></p><div class="dialog-actions"><button type="button" class="btn btn-ghost" id="pf-cancel">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div></form></dialog>
<dialog id="dlg-help" class="dialog"><h2>Cara Bermain</h2><p class="muted" id="help-text"></p><div class="dialog-actions"><button type="button" class="btn btn-primary" id="help-close">Faham!</button></div></dialog>
</body>
</html>
